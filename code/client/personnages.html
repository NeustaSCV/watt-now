<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planche des personnages</title>
    <style>
      :root {
        --fond: #1d2433;
        --encre: #f2efe6;
        --carte: rgba(20, 24, 32, 0.82);
        --accent: #e8735f;
        --doux: #b9b2a2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--fond);
        color: var(--encre);
        font: 14px/1.4 "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .barre {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        background: var(--carte);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .barre strong {
        margin-right: 6px;
      }
      .groupe {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        margin-right: 10px;
      }
      .groupe span {
        color: var(--doux);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-right: 2px;
      }
      button {
        min-height: 36px;
        padding: 0 10px;
        border-radius: 6px;
        border: 1px solid #5a6170;
        background: transparent;
        color: var(--encre);
        font: inherit;
        cursor: pointer;
      }
      button.actif {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .legende {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        display: flex;
        justify-content: space-around;
        pointer-events: none;
        color: var(--doux);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="vue"></canvas>
    <div class="barre" id="barre"></div>
    <div class="legende" id="legende"></div>
    <script type="module" src="./src/planche.ts"></script>
  </body>
</html>
