<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planche des icônes</title>
    <style>
      html, body { margin: 0; background: #e9e0c8; color: #3b2a1e; font: 12px/1.3 "Avenir Next", system-ui, sans-serif; }
      header { padding: 10px 16px; position: sticky; top: 0; background: #e9e0c8ee; border-bottom: 1px solid #c9b48a; z-index: 1; }
      h2 { margin: 18px 16px 6px; font-size: 14px; }
      .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; padding: 0 16px 8px; }
      .case { background: #f4ecd8; border: 1px solid #c9b48a; border-radius: 6px; padding: 6px; text-align: center; position: relative; }
      .case.generique { background: #efe1c8; border-style: dashed; }
      .case .petite { position: absolute; right: 4px; top: 4px; opacity: 0.9; }
      .case small { display: block; color: #7a6a52; }
      .rarete { position: absolute; left: 5px; top: 4px; font-weight: 600; color: #a4552f; }
    </style>
  </head>
  <body>
    <header id="bilan"></header>
    <main id="planche"></main>
    <script type="module" src="./src/planche-icones.ts"></script>
  </body>
</html>
