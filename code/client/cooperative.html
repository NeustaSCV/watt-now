<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planche de la Coopérative</title>
    <style>
      html, body { margin: 0; height: 100%; background: #c9d8e4; color: #1d2433; font: 13px/1.3 "Avenir Next", system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      .barre { position: fixed; left: 8px; top: 8px; right: 8px; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 6px 10px; }
      .barre.cache { display: none; }
      .stats { position: fixed; left: 8px; bottom: 8px; background: rgba(255,255,255,0.85); border-radius: 8px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
      button { min-height: 28px; margin: 2px; }
      button.actif { background: #1d2433; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="vue"></canvas>
    <div class="barre" id="barre"></div>
    <div class="stats" id="stats"></div>
    <script type="module" src="./src/planche-cooperative.ts"></script>
  </body>
</html>
