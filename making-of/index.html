<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Making-of — aperçu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fond: #14161a; --texte: #e8e4da; --doux: #8f8a80; --accent: #7fd4ff; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; }
  .barre { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
  button { background: #2a2e36; color: var(--texte); border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; min-width: 90px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .temps { font-variant-numeric: tabular-nums; color: var(--doux); min-width: 210px; text-align: right; }
  #etat { color: var(--doux); margin-top: 8px; }
</style></head>
<body><main>
<canvas id="c"></canvas>
<div class="barre"><button id="lecture">Lecture</button><input id="curseur" type="range" min="0" step="0.01" value="0"><span class="temps" id="temps"></span></div>
<div id="etat">Chargement…</div>
<audio id="son" src="assets/musique/bande.m4a" preload="auto"></audio>
</main>
<script type="importmap">{ "imports": { "three": "./vendor/three.js" } }</script>
<script type="module">
/* L'aperçu du making-of : la scène en temps réel, avec la bande-son (l'image suit le son).
   ?qualite=haute : occlusion ambiante et anticrénelage (plus lent) ; ?t=12 : commencer à 12 s. */
import { Moteur } from './intro-copie/moteur.js';
import { plan, chargerTout, dessinerLogo, FIN } from './src/film.js';
import { MESURE } from './src/temps.js';
const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c'), son = document.getElementById('son');
const curseur = document.getElementById('curseur'), bouton = document.getElementById('lecture');
const etat = document.getElementById('etat'), affTemps = document.getElementById('temps');
curseur.max = FIN;
await chargerTout();
const moteur = new Moteur(canvas, { plans: [plan], qualite: params.get('qualite') || 'basse', pixels: 1, surCalque: dessinerLogo });
const ajuster = () => moteur.taille(canvas.clientWidth, canvas.clientHeight);
addEventListener('resize', ajuster); ajuster();
let T = Number(params.get('t') || 0), joue = false, dernier = performance.now();
son.currentTime = T;
etat.textContent = 'Prêt. Espace : lecture ou pause.';
const basculer = () => { joue = !joue; bouton.textContent = joue ? 'Pause' : 'Lecture'; if (joue) { if (T >= FIN - 0.05) T = 0; son.currentTime = T; son.play().catch(() => {}); } else son.pause(); };
bouton.onclick = basculer;
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); basculer(); } });
curseur.oninput = () => { T = Number(curseur.value); son.currentTime = T; };
window.apercu = { aller(t) { T = t; son.currentTime = t; }, moteur };
function boucle(maintenant) {
  const dt = Math.min(0.1, (maintenant - dernier) / 1000); dernier = maintenant;
  if (joue) { T = son.paused ? T + dt : son.currentTime; if (T >= FIN) { T = FIN; basculer(); } }
  moteur.image(T, dt);
  curseur.value = T;
  affTemps.textContent = `${T.toFixed(2)} s · mesure ${Math.floor(T / MESURE)} · ${(T % MESURE / MESURE * 4 + 1).toFixed(1)}`;
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
</script>
</body></html>
